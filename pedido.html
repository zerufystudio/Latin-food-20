<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="robots" content="noindex">
<title>Tu pedido · Latin Food 20</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   LATIN FOOD 20 — TU PEDIDO (módulo de pedidos de Zerufy Studio)
   El cliente llega aquí después de pedir. Se actualiza sola cada 4 s
   con ver_pedido(token). Con cobro en caja:
   Esperando pago → Pagado → En preparación → Listo → Entregado
   ===================================================================== */
:root{
  --carbon:#141414; --carbon-2:#1E1B1A; --carbon-3:#2A2523;
  --crema:#F6EBD9;  --crema-2:#EADBC2;
  --brasa:#D12F22;  --brasa-2:#E0463A; --vino:#B0241A;
  --ink:#141414;    --ink-soft:#5B4F47;
  --ok:#2fa45c; --amar:#e8a33d;
  --display:"Archivo",system-ui,-apple-system,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--carbon);color:var(--crema);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
svg{display:block}
.disp{font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100}

.glow{position:fixed;left:50%;top:-34vh;width:150vw;height:110vh;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(209,47,34,.55),rgba(209,47,34,0));transition:opacity 1s ease}
.glow.ok{background:radial-gradient(closest-side,rgba(47,164,92,.38),rgba(47,164,92,0))}
.wrap{position:relative;max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 34px)}
.top{display:flex;align-items:center;justify-content:space-between}
.top a{display:flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.88rem;color:rgba(246,235,217,.75)}
.top a svg{width:18px;height:18px}
.logo{width:120px;color:var(--crema)}
.logo .fl{color:var(--brasa)}

/* ticket */
.ticket{margin-top:18px;border-radius:28px;padding:20px 22px 22px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#2a1512 0%,#1d1513 55%,#171312 100%);border:1px solid rgba(246,235,217,.1);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.ticket::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(209,47,34,.55),transparent)}
.ticket .fl-bg{position:absolute;right:14px;top:14px;width:78px;height:96px;color:var(--brasa);opacity:.85;transform-origin:50% 100%;animation:flicker 2.4s ease-in-out infinite}
.ticket.ok .fl-bg{color:var(--ok)}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.04,.96) rotate(-2deg)}60%{transform:scale(.97,1.05) rotate(2deg)}}
.tags{display:flex;gap:8px;align-items:center;position:relative;z-index:1;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:6px 11px}
.tag.pend{background:var(--amar);color:#2a1a05}
.tag.pag{background:var(--ok);color:#fff}
.tag.lugar{background:var(--crema);color:var(--carbon)}
.tag.prueba{background:transparent;border:1px solid rgba(246,235,217,.4);color:var(--crema)}
.num{position:relative;z-index:1;font-size:5.2rem;line-height:.95;margin-top:14px;letter-spacing:-.02em}
.quien{position:relative;z-index:1;margin-top:6px;font-size:.95rem;color:rgba(246,235,217,.75)}

.msg{margin-top:20px;font-size:1.55rem;line-height:1.15}
.msg-sub{margin-top:6px;color:rgba(246,235,217,.72);font-size:.92rem;line-height:1.45}

/* acércate a la caja */
.caja{margin-top:16px;border-radius:24px;padding:18px;background:var(--crema);color:var(--ink);display:flex;gap:14px;align-items:center}
.caja .ic{width:56px;height:56px;border-radius:16px;background:var(--brasa);color:var(--crema);display:grid;place-items:center;flex:0 0 auto}
.caja .ic svg{width:28px;height:28px}
.caja b{display:block;font-size:1rem}
.caja span{font-size:.84rem;color:var(--ink-soft)}
.caja .tot{margin-left:auto;text-align:right}
.caja .tot small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft)}
.caja .tot strong{font-family:var(--display);font-weight:900;font-variation-settings:"SOFT" 100;font-size:1.7rem}

/* pasos */
.pasos{margin-top:16px;background:var(--crema);color:var(--ink);border-radius:24px;padding:8px 18px}
.paso{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid rgba(20,20,20,.07)}
.paso:last-child{border-bottom:0}
.paso .pt{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;border:2px solid rgba(20,20,20,.18);background:#fff;transition:all .45s cubic-bezier(.2,.8,.2,1)}
.paso .pt svg{width:16px;height:16px;color:#fff;opacity:0;transform:scale(.4);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.paso .tx{flex:1;font-weight:600;font-size:.95rem;color:rgba(20,20,20,.42);transition:color .4s}
.paso .hr{font-size:.74rem;font-weight:600;color:var(--ink-soft)}
.paso.hecho .pt{background:var(--carbon);border-color:var(--carbon)}
.paso.hecho .pt svg{opacity:1;transform:none}
.paso.hecho .tx{color:var(--ink)}
.paso.ahora .pt{background:var(--brasa);border-color:var(--brasa);box-shadow:0 0 0 0 rgba(209,47,34,.6);animation:latido 1.6s ease-out infinite}
.paso.ahora .tx{color:var(--ink);font-weight:700}
.listo .paso.hecho .pt,.listo .paso.ahora .pt{background:var(--ok);border-color:var(--ok)}
@keyframes latido{to{box-shadow:0 0 0 12px rgba(209,47,34,0)}}

/* acciones */
.acc{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px;border-radius:16px;font-weight:700;font-size:.86rem;text-align:center;line-height:1.2;text-decoration:none}
.bt svg{width:18px;height:18px;flex:0 0 auto}
.bt-aviso{background:var(--brasa);color:var(--crema)}
.bt-aviso.on{background:rgba(47,164,92,.16);color:#bff2d2;border:1px solid rgba(47,164,92,.5)}
.bt-sec{background:var(--carbon-3);color:var(--crema)}
.nota-aviso{margin-top:10px;font-size:.78rem;color:rgba(246,235,217,.6);line-height:1.45;text-align:center}

/* detalle */
.det{margin-top:16px;background:var(--carbon-2);border:1px solid rgba(246,235,217,.1);border-radius:24px;padding:18px 20px}
.det h3{font-size:1.25rem;margin-bottom:6px}
.it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(246,235,217,.07);font-size:.94rem}
.it b{min-width:26px;color:#e77b5b}
.it span{flex:1;font-weight:600}
.it span small{display:block;font-weight:500;color:rgba(246,235,217,.6);font-size:.78rem;margin-top:2px}
.it em{font-style:normal;font-weight:600;color:rgba(246,235,217,.75)}
.nota{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(246,235,217,.07);font-size:.86rem}
.tot2{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.tot2 small{font-size:.7rem;font-weight:700;letter-spacing:.14em;color:rgba(246,235,217,.55)}
.tot2 b{font-size:1.9rem}
.donde{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid rgba(246,235,217,.08);font-size:.84rem;line-height:1.35;color:rgba(246,235,217,.8)}
.donde b{display:block;color:var(--crema)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:600;font-size:.86rem;text-decoration:none;background:var(--brasa);color:var(--crema);white-space:nowrap}
.btn svg{width:16px;height:16px}

.confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confeti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:cae linear forwards}
@keyframes cae{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.vacio{text-align:center;padding:80px 10px}
.vacio .disp{font-size:1.8rem;margin-bottom:10px}
.vacio p{color:rgba(246,235,217,.7);margin-bottom:22px}
.carga{display:grid;place-items:center;min-height:60vh}
.carga i{width:38px;height:38px;border-radius:50%;border:3px solid rgba(246,235,217,.15);border-top-color:var(--crema);animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,160%);z-index:20;background:var(--crema);color:var(--ink);font-weight:700;font-size:.88rem;padding:12px 18px;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.pie{text-align:center;margin-top:24px;font-size:.72rem;color:rgba(246,235,217,.38)}
.entra{animation:entra .7s cubic-bezier(.2,.8,.2,1) both}
.entra:nth-child(2){animation-delay:.06s}.entra:nth-child(3){animation-delay:.12s}.entra:nth-child(4){animation-delay:.18s}.entra:nth-child(5){animation-delay:.24s}
@keyframes entra{from{opacity:0;transform:translateY(16px)}}
.cambio{animation:cambio .6s cubic-bezier(.2,.8,.2,1)}
@keyframes cambio{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const VAPID = "BNQ3n0NxSFRdsk71N257cu34bsbvsRu2H0Bgcgo4Mn1cCvE1KD9Qnuxq_BSXqatRhDQVTafRPbsNY651HUeOD7M";

const $ = (s, el=document) => el.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dinero = n => "$" + Number(n).toFixed(2);
const n3 = n => "#" + String(n).padStart(3, "0");
const hora = f => f ? new Date(f).toLocaleTimeString("es-US", { hour:"numeric", minute:"2-digit" }) : "";
const qs = new URLSearchParams(location.search);
const token = qs.get("t") || "";
const ICO = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  campana: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  guardar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>',
  caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="10" width="19" height="10" rx="2"/><path d="M6 10V6h8v4M14 7h4l1.5 3"/><circle cx="12" cy="15" r="2"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
};
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const enPantalla = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const puedePush = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && (!esIOS || enPantalla);

let ultimo = null, audio = null, avisoOn = false, wake = null, pintado = false, timer = null;

/* ---------- textos según cómo va el pedido ---------- */
function etapa(p){
  if(p.estado === "cancelado") return "cancelado";
  if(p.estado === "entregado") return "entregado";
  if(p.estado === "listo") return "listo";
  if(p.estado === "preparando") return "preparando";
  if(p.cobro === "antes" && p.pago !== "pagado") return "por_pagar";
  if(p.cobro === "antes") return "pagado";
  return "recibido";
}
const MSG = {
  por_pagar:  ["Acércate a la caja para pagar tu pedido", "Di tu número en la caja. Pagas en efectivo o por transferencia y empezamos a prepararlo."],
  pagado:     ["¡Pago recibido! En un momento empezamos", "Tu pedido ya está en la fila de la cocina."],
  recibido:   ["Recibimos tu pedido", "En un momento empezamos a prepararlo."],
  preparando: ["Estamos preparando tu pedido", "Te avisamos aquí mismo cuando esté listo."],
  listo:      ["¡Tu pedido está listo!", "Pasa por la ventanilla y di tu número."],
  entregado:  ["¡Buen provecho!", "Gracias por pedir en Latin Food 20."],
  cancelado:  ["Pedido cancelado", "Si tienes dudas, pregunta en la ventanilla."],
};
function pasos(p){
  const e = etapa(p), met = p.metodo_pago ? ` · ${p.metodo_pago}` : "";
  if(p.cobro === "antes"){
    const orden = ["por_pagar","pagado","preparando","listo","entregado"], i = orden.indexOf(e);
    return [
      { t: "Esperando pago en caja", h: hora(p.creado_en), hecho: i > 0, ahora: i === 0 },
      { t: "Pagado" + met, h: hora(p.pagado_en), hecho: i >= 1, ahora: false },
      { t: "En preparación", hecho: i > 2, ahora: i === 1 || i === 2 },
      { t: "Listo", hecho: i > 3, ahora: i === 3 },
      { t: "Entregado", hecho: i >= 4, ahora: false },
    ];
  }
  const orden = ["recibido","preparando","listo","entregado"], i = orden.indexOf(e);
  return [
    { t: "Recibido", h: hora(p.creado_en), hecho: i >= 0, ahora: false },
    { t: "En preparación", hecho: i > 1, ahora: i === 0 || i === 1 },
    { t: "Listo", hecho: i > 2, ahora: i === 2 },
    { t: p.pago === "pagado" ? "Entregado y pagado" + met : "Entregado · pagas al recoger", hecho: i >= 3, ahora: false },
  ];
}

/* ---------- avisos ---------- */
function tono(notas, vol=.25){
  if(!audio) return;
  const t0 = audio.currentTime;
  notas.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i*.18;
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + .55);
  });
}
const b64 = s => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
async function activarAviso(){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); tono([660], .001); }catch(e){}
  try{ if("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); }catch(e){}
  let push = false;
  if(puedePush){
    try{
      const perm = await Notification.requestPermission();
      if(perm === "granted"){
        const reg = await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) });
        const j = sub.toJSON();
        const r = await fetch(NUBE.url + "/rest/v1/rpc/avisar_mi_pedido", {
          method: "POST",
          headers: { apikey: NUBE.anonKey, Authorization: "Bearer " + NUBE.anonKey, "Content-Type": "application/json" },
          body: JSON.stringify({ p_token: token, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth }),
        });
        push = r.ok;
      }
    }catch(e){ push = false; }
  }
  avisoOn = true;
  try{ localStorage.setItem("lf20-aviso-" + token, push ? "push" : "sonido"); }catch(e){}
  pintarAviso(push ? "push" : "sonido");
  aviso(push ? "Listo: te llega una notificación aunque cierres esta página" : "Listo: deja esta página abierta y te sonará cuando esté listo");
  if(navigator.vibrate) navigator.vibrate(30);
}
function pintarAviso(modo){
  const b = $("#bAviso"), n = $("#notaAviso"); if(!b) return;
  if(modo){
    b.classList.add("on");
    b.innerHTML = ICO.check + (modo === "push" ? "Aviso activado" : "Sonido activado");
    n.textContent = modo === "push" ? "Te llega una notificación cuando paguemos y cuando esté listo, aunque cierres esta página."
      : (esIOS ? "En iPhone, deja esta página abierta: te sonará cuando esté listo." : "Deja esta página abierta: te sonará cuando esté listo.");
  } else {
    n.textContent = esIOS && !enPantalla ? "En iPhone, el aviso suena mientras esta página esté abierta." : "Te avisamos aunque cierres esta página.";
  }
}
async function guardarPedido(p){
  const data = { title: `Mi pedido ${n3(p.numero)} · Latin Food 20`, text: `Mi pedido ${n3(p.numero)} en Latin Food 20`, url: location.origin + location.pathname + "?t=" + token };
  try{
    if(navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(data.url); aviso("Enlace copiado. Guárdalo para volver a tu pedido."); }
  }catch(e){}
}
function celebrar(){
  tono([659, 784, 988, 1319]);
  if(navigator.vibrate) navigator.vibrate([220, 120, 220, 120, 400]);
  const box = $("#confeti"); box.innerHTML = "";
  const col = ["#F6EBD9","#D12F22","#2fa45c","#EADBC2","#c2410c"];
  for(let i=0;i<70;i++){
    const c = document.createElement("i");
    c.style.left = Math.random()*100 + "vw"; c.style.background = col[i % col.length];
    c.style.setProperty("--dx", (Math.random()-.5)*160 + "px"); c.style.setProperty("--r", (Math.random()*720 - 360) + "deg");
    c.style.animationDuration = (2.2 + Math.random()*1.8) + "s"; c.style.animationDelay = (Math.random()*.6) + "s";
    box.appendChild(c);
  }
  setTimeout(() => box.innerHTML = "", 5200);
}

/* ---------- pintar ---------- */
function pintar(p){
  const e = etapa(p), [tit, sub] = MSG[e], ok = e === "listo" || e === "entregado";
  document.title = (e === "listo" ? "¡Listo! " : "") + `Pedido ${n3(p.numero)} · Latin Food 20`;
  $("#glow").classList.toggle("ok", ok);

  if(!pintado){
    $("#app").innerHTML = `
      <section class="ticket entra" id="ticket">
        <svg viewBox="157.5 187.0 101.0 101.0" class="fl-bg" aria-hidden="true"><use href="#lf-llama" fill="currentColor"/></svg>
        <div class="tags" id="tags"></div>
        <div class="num disp">${n3(p.numero)}</div>
        <div class="quien">${esc(p.nombre)} · ${hora(p.creado_en)}</div>
        <h1 class="msg disp" id="msg"></h1>
        <p class="msg-sub" id="msgSub"></p>
      </section>
      <div id="cajaBox"></div>
      <section class="pasos entra" id="pasos"></section>
      <section class="entra">
        <div class="acc">
          <button class="bt bt-aviso" id="bAviso" type="button">${ICO.campana}Avísame cuando esté listo</button>
          <button class="bt bt-sec" id="bGuardar" type="button">${ICO.guardar}Guardar mi pedido</button>
        </div>
        <p class="nota-aviso" id="notaAviso"></p>
      </section>
      <section class="det entra">
        <h3 class="disp">Tu pedido</h3>
        ${(p.items || []).map(i => `<div class="it"><b>${esc(i.cant)}×</b><span>${esc(i.nombre)}</span><em>${dinero(i.precio * i.cant)}</em></div>`).join("")}
        ${p.nota ? `<div class="nota"><b>Nota:</b> ${esc(p.nota)}</div>` : ""}
        <div class="tot2"><small>TOTAL</small><b class="disp">${dinero(p.total)}</b></div>
        ${p.direccion ? `<div class="donde"><div><b>Latin Food 20</b>${esc(p.direccion)}</div>${p.maps_url ? `<a class="btn" href="${esc(p.maps_url)}" target="_blank" rel="noopener">${ICO.pin}Cómo llegar</a>` : ""}</div>` : ""}
      </section>`;
    $("#bAviso").addEventListener("click", activarAviso);
    $("#bGuardar").addEventListener("click", () => guardarPedido(p));
    let modo = null; try{ modo = localStorage.getItem("lf20-aviso-" + token); }catch(x){}
    pintarAviso(modo);
    pintado = true;
  }

  $("#ticket").classList.toggle("ok", ok);
  $("#tags").innerHTML =
    (p.cobro === "antes" || p.pago === "pagado"
      ? (p.pago === "pagado" ? `<span class="tag pag">PAGADO${p.metodo_pago ? " · " + p.metodo_pago.toUpperCase() : ""}</span>` : `<span class="tag pend">POR PAGAR</span>`) : "")
    + `<span class="tag lugar">${p.mesa ? "MESA " + p.mesa : "PARA RECOGER"}</span>`
    + (p.prueba ? `<span class="tag prueba">PRUEBA</span>` : "");
  if($("#msg").textContent !== tit){
    $("#msg").textContent = tit; $("#msgSub").textContent = sub;
    if(ultimo){ $("#ticket").classList.remove("cambio"); void $("#ticket").offsetWidth; $("#ticket").classList.add("cambio"); }
  }
  $("#cajaBox").innerHTML = e === "por_pagar"
    ? `<section class="caja entra"><div class="ic">${ICO.caja}</div><div><b>Paga en la caja</b><span>Di: “${n3(p.numero)}”${p.mesa ? " · Mesa " + p.mesa : ""}</span></div><div class="tot"><small>TOTAL</small><strong>${dinero(p.total)}</strong></div></section>` : "";
  $("#pasos").classList.toggle("listo", ok);
  $("#pasos").innerHTML = e === "cancelado" ? `<div class="paso"><div class="tx" style="color:var(--ink)">Este pedido fue cancelado.</div></div>`
    : pasos(p).map(s => `<div class="paso${s.hecho ? " hecho" : ""}${s.ahora ? " ahora" : ""}"><div class="pt">${ICO.check}</div><div class="tx">${esc(s.t)}</div>${s.hecho && s.h ? `<div class="hr">${s.h}</div>` : ""}</div>`).join("");
  const abierto = ["por_pagar","pagado","recibido","preparando"].includes(e);
  $("#bAviso").parentElement.parentElement.style.display = abierto ? "" : "none";

  if(ultimo && ultimo !== e){
    if(e === "listo") celebrar();
    else if(avisoOn || audio) tono([784, 988], .2);
    if(navigator.vibrate && e !== "listo") navigator.vibrate(120);
  }
  ultimo = e;
}

async function cargar(){
  if(!/^[0-9a-f-]{36}$/i.test(token)) return noEncontrado();
  try{
    const r = await fetch(NUBE.url + "/rest/v1/rpc/ver_pedido", {
      method: "POST",
      headers: { apikey: NUBE.anonKey, Authorization: "Bearer " + NUBE.anonKey, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: token }),
    });
    if(!r.ok) return;
    const p = await r.json();
    if(!p) return noEncontrado();
    pintar(p);
  }catch(e){ /* sin señal: se reintenta solo */ }
}
function noEncontrado(){
  $("#app").innerHTML = `<div class="vacio"><div class="disp">No encontramos este pedido</div><p>El enlace no es válido o el pedido es de hace más de 2 días.</p><a class="btn" href="./">Ver el menú</a></div>`;
  if(timer) clearInterval(timer);
}
let tt = null;
function aviso(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3200); }

cargar();
timer = setInterval(() => { if(!document.hidden) cargar(); }, 4000);
document.addEventListener("visibilitychange", async () => {
  if(!document.hidden){
    cargar();
    if(avisoOn && "wakeLock" in navigator){ try{ wake = await navigator.wakeLock.request("screen"); }catch(e){} }
  }
});
</script>
